<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Опрос жителей СНТ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #1e293b;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        h2 {
            color: #0f172a;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }
        input[type="text"],
        input[type="email"],
        textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }
        .radio-group, .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .radio-option, .checkbox-option {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: normal;
            cursor: pointer;
        }
        button {
            width: 100%;
            background-color: #0284c7;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0369a1;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Электронный опрос жителей СНТ</h2>
    
    <form id="surveyForm">
        <div class="form-group">
            <label for="emailInput">Ваш E-mail:*</label>
            <input type="email" id="emailInput" name="email" required placeholder="example@mail.ru">
        </div>

        <div class="form-group">
            <label for="plotInput">Номер участка:*</label>
            <input type="text" id="plotInput" name="plot" required placeholder="Например: 17">
        </div>

        <div class="form-group">
            <label>1. Ваша оценка сметы:*</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="q_smeta" value="Поддерживаю" required> Поддерживаю</label>
                <label class="radio-option"><input type="radio" name="q_smeta" value="Не поддерживаю"> Не поддерживаю</label>
                <label class="radio-option"><input type="radio" name="q_smeta" value="Затрудняюсь ответить"> Затрудняюсь ответить</label>
            </div>
        </div>

        <div class="form-group">
            <label>2. Ваше отношение к текущему статусу СНТ:*</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="snt_status" value="Удовлетворительно" required> Удовлетворительно</label>
                <label class="radio-option"><input type="radio" name="snt_status" value="Требует изменений"> Требует изменений</label>
            </div>
        </div>

        <div class="form-group">
            <label>3. Как вы оцениваете работу правления?*</label>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="board_eval" value="Полностью удовлетворен(а)" required> Полностью удовлетворен(а)</label>
                <label class="radio-option"><input type="radio" name="board_eval" value="Скорее удовлетворен(а)"> Скорее удовлетворен(а)</label>
                <label class="radio-option"><input type="radio" name="board_eval" value="Скорее неудовлетворен(а)"> Скорее неудовлетворен(а)</label>
                <label class="radio-option"><input type="radio" name="board_eval" value="Совершенно не удовлетворен(а)"> Совершенно не удовлетворен(а)</label>
            </div>
        </div>

        <div class="form-group">
            <label>4. Приоритетные направления (до 3-х вариантов):</label>
            <div class="checkbox-group">
                <label class="checkbox-option"><input type="checkbox" name="priorities" value="Вывоз мусора и экологический контроль"> Вывоз мусора и экологический контроль</label>
                <label class="checkbox-option"><input type="checkbox" name="priorities" value="Прозрачность финансовой отчетности"> Прозрачность финансовой отчетности</label>
                <label class="checkbox-option"><input type="checkbox" name="priorities" value="Обслуживание дорог и расчистка"> Обслуживание дорог и расчистка</label>
                <label class="checkbox-option"><input type="checkbox" name="priorities" value="Электроснабжение и освещение"> Электроснабжение и освещение</label>
            </div>
        </div>

        <div class="form-group">
            <label for="commentsInput">5. Ваши предложения и комментарии:</label>
            <textarea id="commentsInput" name="comments" rows="4" placeholder="Введите ваши комментарии..."></textarea>
        </div>

        <button type="submit" id="submitBtn">Отправить голос</button>
    </form>
</div>

<script>
document.getElementById('surveyForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = 'Отправка...';

    const formData = {
        email: document.getElementById('emailInput').value.trim(),
        plot: document.getElementById('plotInput').value.trim(),
        q_smeta: document.querySelector('input[name="q_smeta"]:checked')?.value || '',
        snt_status: document.querySelector('input[name="snt_status"]:checked')?.value || '',
        board_eval: document.querySelector('input[name="board_eval"]:checked')?.value || '',
        priorities: Array.from(document.querySelectorAll('input[name="priorities"]:checked')).map(cb => cb.value).join(', ') || 'Не выбрано',
        comments: document.getElementById('commentsInput').value.trim() || 'Нет'
    };

    try {
        const response = await fetch('https://formspree.io/f/xzebvepl', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: JSON.stringify(formData)
        });

        if (response.ok) {
            alert('Ваш голос успешно принят и отправлен!');
            this.reset();
        } else {
            const result = await response.json();
            alert('Ошибка отправки: ' + (result.error || 'Неизвестная ошибка'));
        }
    } catch (error) {
        console.error('Ошибка:', error);
        alert('Произошла ошибка при отправке. Проверьте подключение к интернету.');
    } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Отправить голос';
    }
});
</script>

</body>
</html>
